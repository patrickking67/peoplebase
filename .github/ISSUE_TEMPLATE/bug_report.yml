name: Bug report
description: Something in PeopleBase does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real employee data, secrets or security vulnerabilities. Report vulnerabilities through the security advisory form instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. flask --app app seed-demo
        2. Open /time-off
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: main at abc1234
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: Python 3.12 on macOS
